<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ad Vitam Test Site</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --primary: #1d4ed8;
        --primary-dark: #163ea8;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #dbe3f0;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4ff 0%, var(--bg) 100%);
        color: var(--text);
      }

      .card {
        width: min(90vw, 560px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 18px 45px rgba(29, 78, 216, 0.12);
        padding: 2rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 4vw, 2.6rem);
      }

      p {
        margin: 0.6rem 0;
        color: var(--muted);
        line-height: 1.6;
      }

      button {
        margin-top: 1rem;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 0.85rem 1.25rem;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      #status {
        color: var(--text);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Ad Vitam</h1>
      <p>This is a simple test site for verifying a basic static page loads correctly.</p>
      <button id="statusBtn" type="button">Click me</button>
      <p id="status">Status: Ready.</p>
    </main>

    <script>
      const button = document.getElementById('statusBtn');
      const status = document.getElementById('status');

      button.addEventListener('click', () => {
        status.textContent = 'Status: Interaction works!';
      });
    </script>
  </body>
</html>
